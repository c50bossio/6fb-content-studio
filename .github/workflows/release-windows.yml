name: Build & Release (Windows)

on:
  workflow_call:
    inputs:
      version:
        description: Release version with or without a leading v
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Non-publishing package version to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build bundled Python runtime
        shell: powershell
        run: npm run runtime:win

      - name: Run full test suite
        shell: powershell
        run: |
          $env:SIXFB_TEST_PYTHON = (Resolve-Path "python/.build-venv-win32-x64/Scripts/python.exe").Path
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate bundled runtime
        shell: powershell
        run: |
          function Assert-NativeSuccess([string]$Command) {
            if ($LASTEXITCODE -ne 0) { throw "$Command failed with exit code $LASTEXITCODE" }
          }
          node scripts/assert-packaged-runtime.cjs win32-x64
          Assert-NativeSuccess "assert-packaged-runtime"
          .\python\runtime\win32-x64\pipeline\6fb-pipeline\6fb-pipeline.exe --runtime-check
          Assert-NativeSuccess "pipeline runtime check"
          .\python\runtime\win32-x64\pipeline\6fb-pipeline\6fb-pipeline.exe --help
          Assert-NativeSuccess "pipeline help"
          .\python\runtime\win32-x64\bin\ffmpeg.exe -version
          Assert-NativeSuccess "ffmpeg version"
          .\python\runtime\win32-x64\bin\ffprobe.exe -version
          Assert-NativeSuccess "ffprobe version"

      - name: Package Windows installer
        shell: powershell
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          function Assert-NativeSuccess([string]$Command) {
            if ($LASTEXITCODE -ne 0) { throw "$Command failed with exit code $LASTEXITCODE" }
          }
          $version = $env:RELEASE_VERSION_INPUT.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Invalid release version: $version"
            exit 1
          }
          npm version $version --no-git-tag-version --allow-same-version
          Assert-NativeSuccess "npm version"
          npm run package:win -- --publish never
          Assert-NativeSuccess "Windows package"
          $installer = Get-ChildItem -Path release -File -Filter "*.exe" | Where-Object { $_.Name -match "Setup" } | Select-Object -First 1
          $portable = Get-ChildItem -Path release -File -Filter "*.exe" | Where-Object { $_.Name -notmatch "Setup" } | Select-Object -First 1
          $blockmap = Get-ChildItem -Path release -File -Filter "*.blockmap" | Select-Object -First 1
          $latest = Get-ChildItem -Path release -File -Filter "latest.yml" | Select-Object -First 1

          if (-not $installer) { Write-Error "Missing Windows installer artifact"; exit 1 }
          if (-not $portable) { Write-Error "Missing Windows portable artifact"; exit 1 }
          if (-not $blockmap) { Write-Error "Missing Windows blockmap artifact"; exit 1 }
          if (-not $latest) { Write-Error "Missing latest.yml artifact"; exit 1 }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$version`n", $utf8NoBom)

      - name: Smoke Windows app launch
        shell: powershell
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node scripts/smoke-windows-app.cjs

      - name: Stage Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
