name: Build & Release (macOS)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-15

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6

      # ── 2. Node ────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundled Python runtime
        run: npm run runtime:mac

      - name: Validate release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID GH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      # ── 3. Import Developer ID cert from secret ────────────────────
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temp keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Allow codesign to use it without prompting
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      # ── 4. Package → signed + styled DMG via electron-builder ──────
      - name: Package macOS (signed DMG)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          # Stamp package.json with the tag version so latest-mac.yml gets the right semver
          npm version ${VERSION} --no-git-tag-version --allow-same-version
          # --publish never so we control the release ourselves; electron-builder still writes latest-mac.yml
          npm run package:mac:release -- --publish never
          DMG=$(ls release/*.dmg | head -1)
          ZIP=$(ls release/*.zip | head -1)
          ZIP_BLOCKMAP=$(ls release/*.zip.blockmap | head -1)
          YML=$(ls release/latest-mac.yml 2>/dev/null | head -1)
          echo "DMG_PATH=${DMG}" >> $GITHUB_ENV
          echo "ZIP_PATH=${ZIP}" >> $GITHUB_ENV
          echo "ZIP_BLOCKMAP_PATH=${ZIP_BLOCKMAP}" >> $GITHUB_ENV
          echo "YML_PATH=${YML}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Validate release artifacts
        run: |
          test -n "$DMG_PATH" && test -f "$DMG_PATH" || { echo "::error::Missing DMG artifact"; exit 1; }
          test -n "$ZIP_PATH" && test -f "$ZIP_PATH" || { echo "::error::Missing ZIP artifact"; exit 1; }
          test -n "$ZIP_BLOCKMAP_PATH" && test -f "$ZIP_BLOCKMAP_PATH" || { echo "::error::Missing ZIP blockmap artifact"; exit 1; }
          test -n "$YML_PATH" && test -f "$YML_PATH" || { echo "::error::Missing latest-mac.yml artifact"; exit 1; }

      - name: Verify signed app
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/6FB Content Studio.app"

      # ── 5. Notarize the styled DMG ─────────────────────────────────
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      # ── 6. Staple ticket onto DMG ──────────────────────────────────
      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Normalize updater metadata
        run: |
          node scripts/normalize-mac-update-metadata.cjs "$YML_PATH" "$ZIP_PATH"
          if grep -q '\.dmg' "$YML_PATH"; then
            echo "::error::latest-mac.yml must not reference the DMG after stapling mutates it"
            exit 1
          fi

      # ── 7. Publish to GitHub Releases ──────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "6FB Content Studio v${{ env.VERSION }}"
          body: |
            ## 6FB Content Studio v${{ env.VERSION }}

            **Signed & notarized — opens without any security prompt on macOS.**

            ### Install
            1. Download the `.dmg` below
            2. Drag **6FB Content Studio** to Applications
            3. Double-click — opens immediately, no warnings

            ### First-time setup
            Settings → 6FB Account → sign in → Sync Instagram
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}
            ${{ env.YML_PATH }}
            ${{ env.ZIP_BLOCKMAP_PATH }}
          token: ${{ secrets.GH_TOKEN }}
