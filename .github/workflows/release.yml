name: Build & Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release tag and notes
        id: version
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release workflow requires a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          test -n "$GH_TOKEN" || {
            echo "::error::Missing required release secret: GH_TOKEN"
            exit 1
          }
          test -f "delivery/release-notes/v${VERSION}.md" || {
            echo "::error::Missing tracked release notes for v${VERSION}"
            exit 1
          }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  release-mac:
    needs: validate-tag
    runs-on: macos-15

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # ── 2. Node ────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundled Python runtime
        run: npm run runtime:mac

      - name: Run full test suite
        env:
          SIXFB_TEST_PYTHON: ${{ github.workspace }}/python/.build-venv/bin/python
        run: npm test

      - name: Validate bundled runtime
        run: |
          node scripts/assert-packaged-runtime.cjs darwin-arm64
          ./python/runtime/darwin-arm64/pipeline/6fb-pipeline/6fb-pipeline --runtime-check
          ./python/runtime/darwin-arm64/pipeline/6fb-pipeline/6fb-pipeline --help
          ./python/runtime/darwin-arm64/bin/ffmpeg -version
          ./python/runtime/darwin-arm64/bin/ffprobe -version

      - name: Validate release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      # ── 3. Import Developer ID cert from secret ────────────────────
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temp keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Allow codesign to use it without prompting
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # electron-builder 26 may pass the certificate name to nested codesign.
          # If the p12 contains duplicate Developer ID identities with the same
          # name, codesign treats that name as ambiguous even inside one keychain.
          bash scripts/prune-mac-signing-identities.sh "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      # ── 4. Package → signed + styled DMG via electron-builder ──────
      - name: Package macOS (signed DMG)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          # Stamp package.json with the tag version so latest-mac.yml gets the right semver
          npm version ${VERSION} --no-git-tag-version --allow-same-version
          # --publish never so we control the release ourselves; electron-builder still writes latest-mac.yml
          npm run package:mac:release -- --publish never
          DMG=$(ls release/*.dmg | head -1)
          ZIP=$(ls release/*.zip | head -1)
          ZIP_BLOCKMAP=$(ls release/*.zip.blockmap | head -1)
          YML=$(ls release/latest-mac.yml 2>/dev/null | head -1)
          echo "DMG_PATH=${DMG}" >> $GITHUB_ENV
          echo "ZIP_PATH=${ZIP}" >> $GITHUB_ENV
          echo "ZIP_BLOCKMAP_PATH=${ZIP_BLOCKMAP}" >> $GITHUB_ENV
          echo "YML_PATH=${YML}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Validate release artifacts
        run: |
          test -n "$DMG_PATH" && test -f "$DMG_PATH" || { echo "::error::Missing DMG artifact"; exit 1; }
          test -n "$ZIP_PATH" && test -f "$ZIP_PATH" || { echo "::error::Missing ZIP artifact"; exit 1; }
          test -n "$ZIP_BLOCKMAP_PATH" && test -f "$ZIP_BLOCKMAP_PATH" || { echo "::error::Missing ZIP blockmap artifact"; exit 1; }
          test -n "$YML_PATH" && test -f "$YML_PATH" || { echo "::error::Missing latest-mac.yml artifact"; exit 1; }

      - name: Verify signed app
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/6FB Content Studio.app"

      # ── 5. Notarize the styled DMG ─────────────────────────────────
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      # ── 6. Staple ticket onto DMG ──────────────────────────────────
      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Normalize updater metadata
        run: |
          node scripts/normalize-mac-update-metadata.cjs "$YML_PATH" "$ZIP_PATH"
          if grep -q '\.dmg' "$YML_PATH"; then
            echo "::error::latest-mac.yml must not reference the DMG after stapling mutates it"
            exit 1
          fi

      - name: Stage macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}
            ${{ env.YML_PATH }}
            ${{ env.ZIP_BLOCKMAP_PATH }}

  release-windows:
    needs: validate-tag
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}

  stage-release:
    needs:
      - release-mac
      - release-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.stage-draft.outputs.id }}

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download staged release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Validate complete release set
        id: validate-release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          expected=(
            "6FB-Content-Studio-arm64.dmg"
            "6FB-Content-Studio-arm64.zip"
            "6FB-Content-Studio-arm64.zip.blockmap"
            "latest-mac.yml"
            "6FB-Content-Studio-${VERSION}.exe"
            "6FB-Content-Studio-Setup-${VERSION}.exe"
            "6FB-Content-Studio-Setup-${VERSION}.exe.blockmap"
            "latest.yml"
          )
          for name in "${expected[@]}"; do
            test -s "release/$name" || {
              echo "::error::Missing or empty release artifact: $name"
              exit 1
            }
          done
          actual_count=$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$actual_count" -eq "${#expected[@]}" || {
            echo "::error::Expected ${#expected[@]} artifacts, found $actual_count"
            find release -maxdepth 1 -type f -print
            exit 1
          }
          test -f "delivery/release-notes/v${VERSION}.md" || {
            echo "::error::Missing tracked release notes for v${VERSION}"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage complete draft release
        id: stage-draft
        uses: softprops/action-gh-release@v3
        with:
          name: "6FB Content Studio v${{ steps.validate-release.outputs.version }}"
          body_path: delivery/release-notes/v${{ steps.validate-release.outputs.version }}.md
          files: release/*
          fail_on_unmatched_files: true
          draft: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Verify exact draft asset manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_ID: ${{ steps.stage-draft.outputs.id }}
          VERSION: ${{ steps.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID" || {
            echo "::error::Draft release ID was not returned for $GITHUB_REF_NAME"
            exit 1
          }
          release_state=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '[.draft, .tag_name] | @tsv')
          test "$release_state" = $'true\t'"$GITHUB_REF_NAME" || {
            echo "::error::Staged release does not match the expected draft tag: $release_state"
            exit 1
          }
          expected=(
            "6FB-Content-Studio-arm64.dmg"
            "6FB-Content-Studio-arm64.zip"
            "6FB-Content-Studio-arm64.zip.blockmap"
            "latest-mac.yml"
            "6FB-Content-Studio-${VERSION}.exe"
            "6FB-Content-Studio-Setup-${VERSION}.exe"
            "6FB-Content-Studio-Setup-${VERSION}.exe.blockmap"
            "latest.yml"
          )
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[].name' | sort > "$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt" || {
            echo "::error::Draft release asset manifest is not exact"
            exit 1
          }
          empty_assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.size <= 0) | .name')
          test -z "$empty_assets" || {
            echo "::error::Draft release contains empty assets: $empty_assets"
            exit 1
          }

  smoke-staged-mac:
    needs: stage-release
    runs-on: macos-15

    steps:
      - name: Checkout release smoke
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Smoke staged macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
          RELEASE_INCLUDE_DRAFT: '1'
        run: bash scripts/smoke-mac-release-dmg.sh "$GITHUB_REF_NAME"

  publish-release:
    needs: smoke-staged-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish certified complete release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          gh release edit "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --draft=false --latest --verify-tag

  smoke-published-mac:
    needs: publish-release
    runs-on: macos-15

    steps:
      - name: Checkout public release smoke
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Smoke public macOS DMG
        run: bash scripts/smoke-mac-release-dmg.sh "$GITHUB_REF_NAME"
